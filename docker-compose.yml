services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: solar
      POSTGRES_PASSWORD: solar
      POSTGRES_DB: solar_accounting
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solar -d solar_accounting"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
      target: development
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://solar:solar@postgres:5432/solar_accounting?schema=public
      REDIS_URL: redis://redis:6379
      WEB_ORIGIN: http://localhost:5173
      LOG_LEVEL: info
      SESSION_SECRET: dev-session-secret-change-before-production
      SEED_ADMIN_EMAIL: admin@solar.local
      SEED_ADMIN_PASSWORD: SolarDevAdmin-2026
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
      target: development
    environment:
      VITE_API_URL: http://localhost:3000
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  postgres_data:
